name: ci

on: 
  push:
    branches:[main]
  pull_request:
    branches:[main]


jobs: 
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

- run: pnpm vitest run

      - run: pnpm build

  load-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: load-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: load-tests/package-lock.json

      - run: npm install

      - run: npm run typecheck

      - run: npm run build